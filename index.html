/* Pixel look after the offline dinosaur page. One token set, three palettes, rotated by level: Day, Night, Handheld. */
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --font-ui:"Fenceline Pixel",ui-monospace,Menlo,Consolas,"Courier New",monospace;
  --font-display:var(--font-ui);
  /* Day: the dinosaur page. Off-white, one grey ink. */
  --bg:#f7f7f7;--text:#535353;--muted:#6b6b6b;--line:#b4b4b4;
  --panel:#f7f7f7;--panel-text:#535353;--panel-muted:#6b6b6b;
  --accent:#535353;--accent-ink:#f7f7f7;--focus:#535353;--life:#535353;
  --ground:#f7f7f7;--land:#e1e1e1;--land-ink:#a9a9a9;--edge:#535353;--post:#f7f7f7;
  --trail:#535353;--wisp:#535353;--ember:#9a9a9a;--player:#535353;
}
:root[data-theme="night"]{
  --bg:#1e1f22;--text:#ececec;--muted:#a3a3a8;--line:#55565c;
  --panel:#1e1f22;--panel-text:#ececec;--panel-muted:#a3a3a8;
  --accent:#ececec;--accent-ink:#1e1f22;--focus:#ececec;--life:#ececec;
  --ground:#1e1f22;--land:#2c2d31;--land-ink:#4d4e55;--edge:#ececec;--post:#1e1f22;
  --trail:#ececec;--wisp:#ececec;--ember:#8e8e94;--player:#ececec;
}
:root[data-theme="handheld"]{
  --bg:#9bbc0f;--text:#0b2a0b;--muted:#143514;--line:#306230;
  --panel:#8bac0f;--panel-text:#0b2a0b;--panel-muted:#143514;
  --accent:#0b2a0b;--accent-ink:#9bbc0f;--focus:#0b2a0b;--life:#0b2a0b;
  --ground:#9bbc0f;--land:#8bac0f;--land-ink:#306230;--edge:#0b2a0b;--post:#9bbc0f;
  --trail:#0b2a0b;--wisp:#0b2a0b;--ember:#306230;--player:#0b2a0b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:18px/28px var(--font-ui);font-synthesis:none;overflow-x:clip;overflow-y:clip;touch-action:none;user-select:none;-webkit-user-select:none}
#app{--w:640px;--px:4px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s3);padding:var(--s2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Pixel borders: a 4px box-shadow frame on each side leaves the corners notched, like a sprite outline. Type sits on a 2px pixel grid (18px = 9 font pixels). */
.bar,.panel,button,#c{--bc:var(--text);border:0;box-shadow:0 -4px 0 0 var(--bc),0 4px 0 0 var(--bc),-4px 0 0 0 var(--bc),4px 0 0 0 var(--bc)}
.panel{--bc:var(--panel-text)}

#hud{width:var(--hw,var(--w));display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s2) var(--s5)}
.mark{margin:0;font-size:27px;line-height:27px;font-weight:400}
.stats{display:flex;gap:var(--s5)}
.st{display:flex;flex-direction:column;gap:var(--s1);min-width:0}
.lbl{font-size:18px;line-height:18px;color:var(--muted)}
.st b{font-size:27px;line-height:27px;font-weight:400}
#hLives{color:var(--life);min-width:3.2em}
.btns{display:flex;gap:var(--s4)}
@media (max-width:640px){.mark{order:1}.btns{order:2}.stats{order:3;flex:1 1 100%;justify-content:space-between;gap:var(--s2)}}
@media (pointer:coarse){.mark,.btns{display:none}.stats{flex:1 1 100%;justify-content:space-between;gap:var(--s2)}}
@media (max-height:520px){.mark{display:none}}

#prog{width:var(--hw,var(--w))}
.bar{position:relative;height:16px;margin:4px;background:var(--panel)}
#barFill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent)}
#barTick{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:var(--text);box-shadow:0 0 0 2px var(--bg)}
.prow{display:flex;justify-content:space-between;margin-top:var(--s3);font-size:18px;line-height:18px;color:var(--muted)}

#wrap{position:relative;line-height:0;margin:4px}
canvas{display:block;image-rendering:pixelated}

button{display:inline-flex;align-items:center;justify-content:center;font:400 18px/18px var(--font-ui);min-height:44px;margin:4px;padding:0 var(--s4);border-radius:0;background:transparent;color:var(--text);cursor:pointer}
button:hover{background:var(--text);color:var(--bg)}
button:active{transform:translateY(4px)}
button:focus-visible{outline:4px dotted var(--focus);outline-offset:8px}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.primary:hover{background:var(--bg);color:var(--text)}

#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:flex-start;padding:var(--s5);line-height:1.4;overflow:auto;background:color-mix(in srgb,var(--bg) 70%,transparent)}
#ov.on{display:flex}
.panel{width:min(30rem,100%);max-height:100%;margin:4px;display:grid;gap:var(--s3);padding:var(--s5);background:var(--panel);color:var(--panel-text)}
.panel h2{margin:0;min-width:0;text-wrap:balance;font-size:36px;line-height:40px;font-weight:400}
.panel p{margin:0;max-width:65ch;font-size:18px;line-height:28px}
.panel .fine{color:var(--panel-muted)}
.panel button{justify-self:start;background:var(--panel);color:var(--panel-text)}
.panel button:hover{background:var(--panel-text);color:var(--panel)}
.panel button.primary{background:var(--accent);color:var(--accent-ink)}
.panel button.primary:hover{background:var(--panel);color:var(--panel-text)}
.panel button:focus-visible{outline-color:var(--panel-text)}
.panel .actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s2) var(--s4)}
.panel .credit{margin:0;color:var(--panel-muted);font-size:18px;line-height:28px}
.panel .credit a{display:inline-block;padding:8px 0;color:var(--panel-text);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;cursor:pointer}
.panel .credit a:hover{background:var(--panel-text);color:var(--panel);text-decoration:none}
.panel .credit a:focus-visible{outline:4px dotted var(--panel-text);outline-offset:4px}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:var(--s3)}
.legend li{display:grid;grid-template-columns:44px 1fr;gap:var(--s3);align-items:center;font-size:18px;line-height:28px}
.key{justify-self:center}
#ov{touch-action:pan-y}
@media (max-width:600px){#ov{align-items:flex-start;padding:var(--s3)}.panel{max-height:none;padding:var(--s4);gap:var(--s2)}.panel .credit a{padding:4px 0}.legend{gap:var(--s2)}.legend li{grid-template-columns:40px 1fr;gap:var(--s2);line-height:24px}.panel h2{font-size:27px;line-height:32px}.panel .fine{display:none}.panel:has(.legend:not([hidden])) #ovP{display:none}}

#dpad{display:none;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(3,48px);gap:var(--s3);grid-template-areas:"p u m" "l . r" ". d .";touch-action:none}
#dpad button{margin:0;padding:0;min-height:0;font-size:36px;background:var(--panel);color:var(--panel-text);touch-action:none}
#dpad #bPause,#dpad #bMute{font-size:18px}#dpad #bPause{grid-area:p}#dpad #bMute{grid-area:m}#dpad [data-d=l] .ar{transform:rotate(-90deg)}#dpad [data-d=r] .ar{transform:rotate(90deg)}#dpad [data-d=d] .ar{transform:rotate(180deg)}#dpad [data-d=u]{grid-area:u}#dpad [data-d=l]{grid-area:l}#dpad [data-d=r]{grid-area:r}#dpad [data-d=d]{grid-area:d}
@media (pointer:coarse){#dpad{display:grid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <h1 class="mark">Fenceline</h1>
    <div class="stats">
      <div class="st"><span class="lbl">Score</span><b id="hScore">0</b></div>
      <div class="st"><span class="lbl">Best</span><b id="hBest">0</b></div>
      <div class="st"><span class="lbl">Level</span><b id="hLevel">1</b></div>
      <div class="st"><span class="lbl">Lives</span><b id="hLives"></b></div>
    </div>
    <div class="btns">
      <button id="bPause" type="button">Pause</button>
      <button id="bMute" type="button">Mute</button>
    </div>
  </header>
  <div id="prog" role="progressbar" aria-label="Land claimed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="bar"><div id="barFill"></div><div id="barTick"></div></div>
    <div class="prow"><span id="pctTxt">Claimed 0%</span><span id="tgtTxt">Target 70%</span></div>
  </div>
  <div id="wrap">
    <canvas id="c" role="img" aria-label="Fenceline playfield"></canvas>
    <div id="ov" role="dialog" aria-modal="true" aria-labelledby="ovT">
      <div class="panel">
        <h2 id="ovT"></h2>
        <p id="ovP"></p>
        <ul class="legend" id="ovLegend" hidden>
          <li><canvas class="key" id="keyYou" aria-hidden="true"></canvas><span><b>You.</b> Walk the walls. Step into open ground to draw.</span></li>
          <li><canvas class="key" id="keyPtero" aria-hidden="true"></canvas><span><b>Pterodactyl.</b> Its dotted line is deadly to your unfinished line.</span></li>
          <li><canvas class="key" id="keyBaby" aria-hidden="true"></canvas><span><b>Crawlers.</b> Babies on the walls. Touch one and you lose a life.</span></li>
        </ul>
        <p class="fine" id="ovC"></p>
        <div class="actions"><button id="ovBtn" class="primary" type="button"></button>
        <p class="credit" id="ovCredit" hidden>Created by <a href="https://github.com/nsijwali" target="_blank" rel="noopener noreferrer">Nitin Sijwali</a></p></div>
      </div>
    </div>
  </div>
  <div id="dpad">
    <button data-d="u" type="button" aria-label="Up"><svg class="ar" viewBox="0 0 5 3" width="20" height="12" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M2 0h1v1H2zM1 1h3v1H1zM0 2h5v1H0z"/></svg></button><button data-d="l" type="button" aria-label="Left"><svg class="ar" viewBox="0 0 5 3" width="20" height="12" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M2 0h1v1H2zM1 1h3v1H1zM0 2h5v1H0z"/></svg></button>
    <button data-d="r" type="button" aria-label="Right"><svg class="ar" viewBox="0 0 5 3" width="20" height="12" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M2 0h1v1H2zM1 1h3v1H1zM0 2h5v1H0z"/></svg></button><button data-d="d" type="button" aria-label="Down"><svg class="ar" viewBox="0 0 5 3" width="20" height="12" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M2 0h1v1H2zM1 1h3v1H1zM0 2h5v1H0z"/></svg></button>
  </div>
  <p id="sr" class="sr" aria-live="polite"></p>
</div>

<script>
'use strict';
/* Fenceline: draw fences to claim land. One file, no assets, no network, no accounts. */
let W = 96, H = 64, N = W * H;

let wisps = [], sparks = [], popups = [], stars = [], clouds = [];

const P_INT = 0.04;                         // seconds per player step

  paused = !paused; $('bPause').textContent = paused ? 'Resume' : 'Pause'; if (paused) musicPause(); else musicResume();
  if (paused) showMsg({title: 'Paused', text: 'Nothing moves while you are paused.', hint: 'Arrow keys or WASD to move. P pauses, M mutes.', btn: 'Resume', fn: togglePause});
  else hideMsg();
}

/* ---------- overlay + hud ---------- */
function showMsg(o) {
  $('ovT').textContent = o.title; $('ovP').textContent = o.text || ''; $('ovP').hidden = !o.text;
  $('ovLegend').hidden = !o.legend; $('ovCredit').hidden = !o.legend; $('ovC').textContent = o.hint || ''; $('ovC').hidden = !o.hint;
  const b = $('ovBtn');
  if (o.btn) { b.hidden = false; b.textContent = o.btn; ovAction = o.fn; b.disabled = !!o.lock; if (!o.lock) b.focus({preventScroll: true}); }
  else { b.hidden = true; ovAction = null; }
  $('ov').classList.add('on'); say(o.title + '. ' + (o.text || ''));
}
function hideMsg() { $('ov').classList.remove('on'); $('ovBtn').blur(); }
function updateHud() {
  $('hScore').textContent = score; $('hBest').textContent = Math.max(best, score); $('hLevel').textContent = level;
  const n = Math.max(0, lives); $('hLives').textContent = '♥'.repeat(n); $('hLives').setAttribute('aria-label', n + ' lives');
  const p = Math.min(100, pct);
  $('barFill').style.width = p + '%'; $('barTick').style.left = target + '%';
  $('pctTxt').textContent = 'Claimed ' + Math.floor(pct) + '%'; $('tgtTxt').textContent = 'Target ' + target + '%';
  $('prog').setAttribute('aria-valuenow', String(Math.floor(p)));
}

/* ---------- game flow ---------- */
function start() {
  score = 0; lives = 3; paused = false; $('bPause').textContent = 'Pause'; sfx('start');
  newLevel(1); state = 'play'; hideMsg(); musicStart(0); say('Level 1. ' + LOOK[THEMES[0]].name + '.');
}
function gameOver() {
  state = 'over'; overT = .8; musicStop(); sfx('over');
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('fenceline.best', String(best)); } catch (e) {} }
  updateHud();
  showMsg({title: 'Game over', text: 'Score ' + score + ' on level ' + level + (isBest ? '. New best.' : '. Best is ' + best + '.'), btn: 'Play again', fn: start, lock: true});
}
function die(spark) {
  if (inv > 0 || state !== 'play') return;
  lives--; if (!RM) shake = .45; freeze = .55; sfx('die'); musicDuck(); say('Life lost. ' + Math.max(0, lives) + ' left.');
  if (drawing) { for (const i of trail) grid[i] = 0; trail = []; drawing = false; px = origin.x; py = origin.y; }
  if (spark) relocateSpark(spark);
  inv = 2; updateHud();
  if (lives <= 0) gameOver();
}
function levelClear() {
  state = 'clear'; clearT = 2.4; musicStop(); sfx('clear');
  const bonus = 1000 * level + Math.max(0, lives) * 500;
  score += bonus; updateHud();
  showMsg({title: 'Level ' + level + ' cleared', text: 'Bonus ' + bonus + '. Next look: ' + LOOK[THEMES[level % 3]].name + '.'});
}
function nextLevel() {
  level++; if (level % 3 === 1 && lives < 5) lives++;
  newLevel(level); state = 'play'; hideMsg(); musicStart(themeIdx); say('Level ' + level + '. ' + LOOK[THEMES[themeIdx]].name + '.');
}

/* ---------- player ---------- */
function stepPlayer() {
  const d = getDir(); if (!d) return;
  const nx = px + d.x, ny = py + d.y;
  if (!inb(nx, ny)) return;
  const c = grid[idx(nx, ny)];
  if (!drawing) {
    if (c === 1) { px = nx; py = ny; }
    else if (c === 0) { drawing = true; trail = []; origin = {x: px, y: py}; grid[idx(nx, ny)] = 2; trail.push(idx(nx, ny)); px = nx; py = ny; tone(500, .03, 'square', .015); }
  } else {
    if (c === 2) return;
    if (c === 0) { grid[idx(nx, ny)] = 2; trail.push(idx(nx, ny)); px = nx; py = ny; tone(500 + trail.length * 2, .03, 'square', .015); }
    else { px = nx; py = ny; closeTrail(); }
  }
}
function closeTrail() {
  const n0 = trail.length;
  for (const i of trail) grid[i] = 1;
  trail = []; drawing = false;
  const vis = new Uint8Array(N), q = new Int32Array(N); let h = 0, t = 0;
  for (const w of wisps) {
    const s = idx(Math.floor(w.x), Math.floor(w.y));
    if (grid[s] === 0 && !vis[s]) { vis[s] = 1; q[t++] = s; }
  }
  while (h < t) {
    const i = q[h++], x = i % W, y = (i / W) | 0;
    if (x > 0 && grid[i - 1] === 0 && !vis[i - 1]) { vis[i - 1] = 1; q[t++] = i - 1; }
    if (x < W - 1 && grid[i + 1] === 0 && !vis[i + 1]) { vis[i + 1] = 1; q[t++] = i + 1; }
    if (y > 0 && grid[i - W] === 0 && !vis[i - W]) { vis[i - W] = 1; q[t++] = i - W; }
    if (y < H - 1 && grid[i + W] === 0 && !vis[i + W]) { vis[i + W] = 1; q[t++] = i + W; }
  }
  let filled = 0;
  for (let i = 0; i < N; i++) if (grid[i] === 0 && !vis[i]) { grid[i] = 1; filled++; }
  const gained = n0 + filled;
  let claimed = 0; for (let i = 0; i < N; i++) if (grid[i] === 1) claimed++;
  pct = Math.max(0, (claimed - base) / (N - base) * 100);
  const pts = gained * 10 + Math.floor(gained * gained / 20);
  score += pts; dirty = true;
  popups.push({x: px, y: py - 1, text: '+' + pts, life: 1.3});
  sfx('claim', gained); updateHud();
  if (pct >= target) levelClear();
}

/* ---------- enemies ---------- */
function updateWisp(w, dt) {
  const sp = Math.hypot(w.vx, w.vy), steps = Math.max(1, Math.ceil(sp * dt / .4)), hh = dt / steps;
  for (let s = 0; s < steps; s++) {
    w.turnT -= hh;
    if (w.turnT <= 0) {
      const a = (Math.random() - .5) * 1.4, c = Math.cos(a), sn = Math.sin(a);
      const vx = w.vx * c - w.vy * sn, vy = w.vx * sn + w.vy * c; w.vx = vx; w.vy = vy; w.turnT = rand(.5, 1.7);
    }
    const nx = w.x + w.vx * hh, ny = w.y + w.vy * hh;
    const cx = at(nx, w.y), cy = at(w.x, ny), cd = at(nx, ny);
    if (cx === 2 || cy === 2 || cd === 2) { die(); return; }
    let bx = cx !== 0, by = cy !== 0;
    if (!bx && !by && cd !== 0) bx = by = true;
    if (bx) w.vx = -w.vx; else w.x = nx;
    if (by) w.vy = -w.vy; else w.y = ny;
  }
  w.da += (Math.random() - .5) * dt * 10; w.da = Math.max(-6, Math.min(6, w.da)); w.a += w.da * dt;
  const ends = [];
  for (const sg of [1, -1]) {
    const ca = Math.cos(w.a) * sg, sa = Math.sin(w.a) * sg; let t = 0;
    for (; t < w.len; t += .5) {
      const v = at(w.x + ca * t, w.y + sa * t);
      if (v === 2) { die(); return; }
      if (v !== 0) break;
    }
    ends.push(w.x + ca * t, w.y + sa * t);
  }
  w.hist.push(ends); if (w.hist.length > 9) w.hist.shift();
}
function moveSpark(s) {
  const dirs = [[1,0],[0,1],[-1,0],[0,-1]], opts = []; let back = null;
  for (const d of dirs) {
    if (!isEdge(s.x + d[0], s.y + d[1])) continue;
    if (d[0] === -s.dx && d[1] === -s.dy) back = d; else opts.push(d);
  }
  let pick = null;
  if (opts.length) {
    const fwd = opts.find(d => d[0] === s.dx && d[1] === s.dy);
    pick = (fwd && (opts.length === 1 || Math.random() > .2)) ? fwd : opts[ri(0, opts.length - 1)];
  } else if (back) pick = back;
  if (!pick) { relocateSpark(s); return; }
  s.dx = pick[0]; s.dy = pick[1]; s.x += pick[0]; s.y += pick[1];
}
function relocateSpark(s) {
  const e = randEdge(25);
  if (e >= 0) { s.x = e % W; s.y = (e / W) | 0; s.dx = 1; s.dy = 0; }
}
function sparkHit() {
  if (drawing || inv > 0) return;
  for (const s of sparks) if (s.x === px && s.y === py) { die(s); return; }
}

/* ---------- update ---------- */
function update(dt) {
  time += dt;
  if (!RM && !paused) for (const c of clouds) { c.x -= c.sp * dt; if (c.x < -8) c.x = W + 4; }
  if (shake > 0) shake = Math.max(0, shake - dt);
  for (const p of popups) p.life -= dt;
  popups = popups.filter(p => p.life > 0);
  if (state === 'over' && overT > 0) { overT -= dt; if (overT <= 0) { $('ovBtn').disabled = false; $('ovBtn').focus({preventScroll: true}); } }
  if (state === 'title') { if (!RM) for (const w of wisps) updateWisp(w, dt); return; }
  if (paused) return;
  if (state === 'clear') { clearT -= dt; if (clearT <= 0) nextLevel(); return; }
  if (state !== 'play') return;
  if (freeze > 0) { freeze -= dt; return; }
  if (inv > 0) inv -= dt;
  pAcc += dt;
  while (pAcc >= P_INT) {
    pAcc -= P_INT;
    if (!getDir()) { pAcc = 0; break; }
    stepPlayer();
    if (state !== 'play') return;
  }
  pAcc = Math.min(pAcc, P_INT * 3);
  for (const w of wisps) { updateWisp(w, dt); if (state !== 'play' || freeze > 0) return; }
  const si = sparkInterval();
  for (const s of sparks) { s.t += dt; while (s.t >= si) { s.t -= si; moveSpark(s); } }
  sparkHit();
}

/* ---------- rendering ---------- */
const hsh = (a, b, c) => { let h = (a * 374761393 + b * 668265263 + c * 1013904223) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
function rebuildTerritory() {
  if (!img) return;
  const w3 = W * SUB, h3 = H * SUB, d = img.data, kind = LOOK[THEMES[themeIdx]].kind;
  edgeList = [];
  for (let i = 0; i < N; i++) { edgeF[i] = (grid[i] === 1 && hasOpenNeighbor(i % W, (i / W) | 0)) ? 1 : 0; if (edgeF[i]) edgeList.push(i); }
  for (let sy = 0; sy < h3; sy++) {
    const cy = (sy / SUB) | 0;
    for (let sx = 0; sx < w3; sx++) {
      const cx = (sx / SUB) | 0, ci = cy * W + cx, o = (sy * w3 + sx) * 4;
      if (grid[ci] !== 1) { d[o + 3] = 0; continue; }
      let ink;
      if (kind === 'speckle') ink = hsh(sx, sy, level) < .06;      // desert grit, fixed per level so it never shimmers
      else ink = (sx & 1) === 0 && (sy & 1) === 0;                  // 1-in-4 checker, a handheld dither
      const c = ink ? P.inkRGB : P.landRGB;
      d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
    }
  }
  octx.putImageData(img, 0, 0); dirty = false;
}
function blit(spr, cx, cy, flip, rot) {
  const w = spr.width / SUB, h = spr.height / SUB;
  ctx.save(); ctx.translate(Math.round(cx * SUB) / SUB, Math.round(cy * SUB) / SUB);
  if (rot) ctx.rotate(rot);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(spr, -w / 2, -h / 2, w, h);
  ctx.restore();
}
function draw() {
  if (dirty) rebuildTerritory();
  const k = dpr * cs, look = LOOK[THEMES[themeIdx]], U = 1 / SUB;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(k, 0, 0, k, k * MARGIN, k * MARGIN);
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * 2, (Math.random() - .5) * shake * 2);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = P.ground; ctx.fillRect(0, 0, W, H);
  if (look.stars) { ctx.fillStyle = P.line; for (const s of stars) ctx.fillRect(Math.round(s.x * SUB) / SUB, Math.round(s.y * SUB) / SUB, U, U); }
  for (const c of clouds) ctx.drawImage(SPR.cloud, Math.round(c.x * SUB) / SUB, Math.round(c.y * SUB) / SUB, SPR.cloud.width / SUB, SPR.cloud.height / SUB);
  if (img) ctx.drawImage(off, 0, 0, W, H);
  // walls are the ground line: crisp cells, with a few pits knocked out like the dinosaur's horizon
  ctx.fillStyle = P.edge;
  for (const i of edgeList) ctx.fillRect(i % W, (i / W) | 0, 1, 1);
  for (const i of edgeList) { const x = i % W, y = (i / W) | 0; if (hsh(x, y, 7) < .14) ctx.drawImage(SPR.pit, x + U, y + U, U, U); }
  for (const i of trail) ctx.drawImage(SPR.trail, i % W, (i / W) | 0, 1, 1);
  // pterodactyls: dotted flight line (the part that kills) plus the sprite on top
  wisps.forEach((w, n) => {
    const e = w.hist[w.hist.length - 1];
    if (e) for (let q = 0; q < 2; q++) {
      const ex = e[q * 2] - w.x, ey = e[q * 2 + 1] - w.y, len = Math.hypot(ex, ey), steps = Math.floor(len / U);
      for (let i = 9; i <= steps; i += 2) ctx.drawImage(SPR.dot, Math.round((w.x + ex * i * U / len) * SUB) / SUB, Math.round((w.y + ey * i * U / len) * SUB) / SUB, U, U);
    }
    blit(SPR.ptero[(Math.floor(time * 6) + n) & 1], w.x, w.y, w.vx > 0, 0);
  });
  // crawlers
  sparks.forEach((s, n) => {
    const spr = SPR.baby[(Math.floor(time * 5) + n) & 1];
    blit(spr, s.x + .5, s.y + .5, s.dx < 0, s.dx < 0 ? 0 : s.dy > 0 ? Math.PI / 2 : s.dy < 0 ? -Math.PI / 2 : 0);
  });
  // player
  const blink = inv > 0 && Math.floor(time * 12) % 2 === 0;
  if (!blink && state !== 'title') blit(SPR.kid[drawing ? 1 : 0], px + .5, py + .5, false, 0);
  // popups
  for (const p of popups) {
    const key = p.text + P.text + P.bg, tc = popCache[key] || (popCache[key] = textCanvas(p.text, P.text, P.bg));
    ctx.globalAlpha = Math.min(1, p.life * 1.5);
    const yy = p.y - (1.3 - p.life) * 3, w = tc.width / SUB, h = tc.height / SUB;
    ctx.drawImage(tc, Math.round((p.x + .5 - w / 2) * SUB) / SUB, Math.round((yy - h) * SUB) / SUB, w, h);
  }
  ctx.globalAlpha = 1;
}

/* ---------- layout + loop ---------- */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const dp = $('dpad'), dpH = getComputedStyle(dp).display === 'none' ? 0 : dp.offsetHeight + 8;
  const aspect = (W + 2 * MARGIN) / (H + 2 * MARGIN), availW = Math.min(innerWidth - 32, 1200);
  let cssW = availW;
  for (let pass = 0; pass < 2; pass++) {
    $('app').style.setProperty('--w', cssW + 'px');
    const used = $('hud').offsetHeight + $('prog').offsetHeight + dpH + 16 + 12 * 3 + 16;
    cssW = Math.max(220, Math.floor(Math.min(availW, (innerHeight - used) * aspect)));
  }
  const cssH = Math.floor(cssW / aspect);
  $('app').style.setProperty('--w', cssW + 'px');
  $('app').style.setProperty('--hw', Math.max(cssW, Math.min(innerWidth - 32, 320)) + 'px');
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  cs = cssW / (W + 2 * MARGIN);
}
addEventListener('resize', resize); addEventListener('orientationchange', resize);
let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(.1, Math.max(0, (t - last) / 1000)); last = t;
  update(dt); draw();
}
resize();
newLevel(1);                 // a live backdrop for the title screen
showMsg({title: 'Fenceline', text: 'Draw from a wall into open ground and back. Whatever the pterodactyl cannot reach is yours. Claim 70% to clear a level. Each level gets a new look.',
  legend: true, hint: 'Arrows or WASD to move. Swipe on touch. P pauses, M mutes.', btn: 'Play', fn: start});
updateHud();
requestAnimationFrame(frame);
</script>
</body>
